name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          profile: minimal

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build NightLink
        run: cargo build --release

      - name: Download Tor
        run: |
          # Tor Project prunes old versions from dist.torproject.org, so
          # discover the newest available stable version from the index and
          # fall back through candidates until one downloads.
          $index = Invoke-WebRequest -Uri "https://dist.torproject.org/torbrowser/" -UseBasicParsing
          $versions = [regex]::Matches($index.Content, 'href="(\d+\.\d+\.\d+)/"') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object { [version]$_ } -Descending
          if (-not $versions) { Write-Error "No Tor browser versions found in the index"; exit 1 }
          Write-Host "Candidate versions: $($versions -join ', ')"
          $downloaded = $false
          foreach ($v in $versions) {
            $uri = "https://dist.torproject.org/torbrowser/$v/tor-expert-bundle-windows-x86_64-$v.tar.gz"
            Write-Host "Trying $uri"
            try {
              Invoke-WebRequest -Uri $uri -OutFile "tor.tar.gz" -ErrorAction Stop
              $downloaded = $true
              Write-Host "Downloaded Tor expert bundle $v"
              break
            } catch {
              Write-Host "Not available: $v"
            }
          }
          if (-not $downloaded) { Write-Error "Could not download any Tor expert bundle"; exit 1 }
          tar -xzf tor.tar.gz
          $torExe = Get-ChildItem -Path ".\tor" -Filter "tor.exe" -Recurse | Select-Object -First 1
          if (-not $torExe) { Write-Error "tor.exe not found after extraction"; exit 1 }
          Copy-Item -Path $torExe.FullName -Destination "target\release\"
          Write-Host "Copied $($torExe.FullName) to target\release\"

      - name: Create release ZIP
        run: |
          $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
          Compress-Archive -Path "target\release\nite.exe", "target\release\tor.exe", "README.md" -DestinationPath "NightLink-v$version.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: NightLink-v*.zip
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          # Note: no `name:` here — the release keeps whatever title the
          # maintainer set when creating it (e.g. a descriptive feature title).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}