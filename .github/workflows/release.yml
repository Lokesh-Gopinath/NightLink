name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          profile: minimal

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build NightLink
        run: cargo build --release

      - name: Download Tor
        run: |
          Invoke-WebRequest -Uri "https://dist.torproject.org/torbrowser/15.0.20/tor-expert-bundle-windows-x86_64-15.0.20.tar.gz" -OutFile "tor.tar.gz"
          tar -xzf tor.tar.gz
          $torExe = Get-ChildItem -Path ".\tor" -Filter "tor.exe" -Recurse | Select-Object -First 1
          if (-not $torExe) { Write-Error "tor.exe not found after extraction"; exit 1 }
          Copy-Item -Path $torExe.FullName -Destination "target\release\"
          Write-Host "Copied $($torExe.FullName) to target\release\"

      - name: Create release ZIP
        run: |
          $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
          Compress-Archive -Path "target\release\nite.exe", "target\release\tor.exe", "README.md" -DestinationPath "NightLink-v$version.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: NightLink-v*.zip
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          name: NightLink v${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}